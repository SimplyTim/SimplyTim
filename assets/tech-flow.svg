    <circle cx="698" cy="54" r="2.5" fill="#D9E5FF">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="934" cy="146" r="2.5" fill="#D9E5FF">
      <animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/>
